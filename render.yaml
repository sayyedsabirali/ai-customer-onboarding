services:
  - type: web
    name: flowai-onboarding
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/main.py
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
