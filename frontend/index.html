<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowAI | Autonomous Customer Onboarding & SLA Intelligence</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Inline SVG Icons for 100% Zero-Dependency Reliability ---
    const IconBot = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
    );
    const IconUser = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    );
    const IconUpload = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
      </svg>
    );
    const IconSend = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
      </svg>
    );
    const IconCheck = () => (
      <svg className="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
      </svg>
    );
    const IconClock = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );
    const IconAlert = () => (
      <svg className="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    );
    const IconRefresh = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );
    const IconShield = () => (
      <svg className="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
    );

    // --- Global React Error Boundary ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-slate-200 flex flex-col items-center justify-center p-6 text-center">
              <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-md shadow-2xl space-y-4">
                <div className="w-12 h-12 rounded-xl bg-rose-500/20 text-rose-400 mx-auto flex items-center justify-center text-xl font-bold">⚠️</div>
                <h2 className="text-base font-bold text-white">Dashboard Encountered an Issue</h2>
                <p className="text-xs text-slate-400 font-mono break-all">{String(this.state.error?.message || this.state.error)}</p>
                <button
                  onClick={() => { this.setState({ hasError: false }); window.location.reload(); }}
                  className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30"
                >
                  Reload Page
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- Main App Component ---
    function App() {
      const [activeTab, setActiveTab] = useState(window.location.pathname.startsWith('/admin') ? 'admin' : 'customer');
      const [health, setHealth] = useState(null);

      // Customer Portal State
      const [sessionId, setSessionId] = useState(localStorage.getItem('flowai_session_id') || '');
      const [customerId, setCustomerId] = useState(localStorage.getItem('flowai_customer_id') || '');
      const [customerName, setCustomerName] = useState(localStorage.getItem('flowai_customer_name') || '');
      const [customerEmail, setCustomerEmail] = useState(localStorage.getItem('flowai_customer_email') || '');
      const [customerStatus, setCustomerStatus] = useState(localStorage.getItem('flowai_customer_status') || 'onboarding_started');
      const [rejectionNotes, setRejectionNotes] = useState('');
      const [customerType, setCustomerType] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputMsg, setInputMsg] = useState('');
      const [resumeEmailInput, setResumeEmailInput] = useState('');
      const [currentStep, setCurrentStep] = useState('not_started');
      const [pendingItems, setPendingItems] = useState([]);
      const [docStatus, setDocStatus] = useState({});
      const [isSending, setIsSending] = useState(false);
      const [uploadingDoc, setUploadingDoc] = useState(null);
      const [escalationInfo, setEscalationInfo] = useState(null);
      const [statusAlert, setStatusAlert] = useState(null);
      const [isRefreshing, setIsRefreshing] = useState(false);

      // Admin Dashboard State
      const [dashboardData, setDashboardData] = useState(null);
      const [escalations, setEscalations] = useState([]);
      const [selectedEscalation, setSelectedEscalation] = useState(null);
      const [resolveNotes, setResolveNotes] = useState('');
      const [resolveAction, setResolveAction] = useState('approve'); // 'approve' | 'request_reupload' | 'reject'
      const [reuploadMessage, setReuploadMessage] = useState('');
      const [adminLoading, setAdminLoading] = useState(false);
      const [selectedCustomerSessions, setSelectedCustomerSessions] = useState([]);
      const [batchFollowUpLoading, setBatchFollowUpLoading] = useState(false);

      const getDocDisplayName = (type) => {
        const map = {
          'pan_card': 'PAN Card',
          'address_proof': 'Proof of Address (Aadhaar / Passport)',
          'company_registration': 'Company Registration Certificate',
          'gst_certificate': 'GST Certificate'
        };
        return map[type] || (type ? type.replace(/_/g, ' ').toUpperCase() : 'Document');
      };

      const isRejected = Boolean(
        customerStatus === 'rejected' ||
        currentStep === 'rejected'
      );

      const allRequiredDocs = (customerType === 'enterprise')
        ? ['pan_card', 'address_proof', 'company_registration', 'gst_certificate']
        : (customerType === 'startup')
          ? ['pan_card', 'address_proof', 'company_registration']
          : ['pan_card', 'address_proof'];

      const activeDoc = isRejected ? null : (pendingItems && pendingItems.length > 0)
        ? (pendingItems.find(doc => docStatus[doc] !== 'verified') || null)
        : (allRequiredDocs.find(doc => docStatus[doc] !== 'verified') || null);

      const isCaseEscalated = Boolean(
        !isRejected && (
          escalationInfo ||
          currentStep === 'escalation' ||
          currentStep === 'escalated'
        )
      );

      const eligibleQueueCustomers = (dashboardData?.prioritized_queue || []).filter(c => {
        const isCompleted = c.sla_status === 'met' || c.current_step === 'complete' || c.customer_status === 'completed' || (!c.pending_items || c.pending_items.length === 0);
        return Boolean(c.session_id && !isCompleted);
      });

      const chatEndRef = useRef(null);

      // Poll System Health once on load
      useEffect(() => {
        fetchHealth();
      }, []);

      const fetchHealth = async () => {
        try {
          const res = await fetch('/health');
          if (res.ok) setHealth(await res.json());
        } catch (e) {
          console.error("Health check error", e);
        }
      };

      // Auto-scroll chat
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isSending]);

      // If sessionId exists on mount, refresh state
      useEffect(() => {
        if (sessionId) {
          syncSessionState(sessionId);
        }
      }, [sessionId]);

      // Reusable helper to format & deduplicate conversation messages
      const formatMessagesList = (rawMessages) => {
        if (!Array.isArray(rawMessages)) return [];
        const cleaned = [];
        rawMessages.forEach(m => {
          const text = (m.content || m.text || '').trim();
          if (!text) return;
          const sender = (m.role === 'assistant' || m.sender === 'agent') ? 'agent' : 'user';
          if (cleaned.length === 0 || cleaned[cleaned.length - 1].sender !== sender || cleaned[cleaned.length - 1].text !== text) {
            cleaned.push({
              sender,
              text,
              time: m.time || ''
            });
          }
        });
        return cleaned;
      };

      // Sync state from backend
      const syncSessionState = async (sid) => {
        if (!sid) return;
        try {
          const res = await fetch(`/onboarding/state/${encodeURIComponent(sid)}`);
          if (res.ok) {
            const data = await res.json();
            if (data.customer_id) {
              setCustomerId(data.customer_id);
              localStorage.setItem('flowai_customer_id', data.customer_id);
            }
            if (data.customer_name) {
              setCustomerName(data.customer_name);
              localStorage.setItem('flowai_customer_name', data.customer_name);
            }
            if (data.customer_email) {
              setCustomerEmail(data.customer_email);
              localStorage.setItem('flowai_customer_email', data.customer_email);
            }
            if (data.customer_type) {
              setCustomerType(data.customer_type);
            }
            if (data.customer_status) {
              setCustomerStatus(data.customer_status);
              localStorage.setItem('flowai_customer_status', data.customer_status);
            }
            if (data.is_rejected || data.customer_status === 'rejected' || data.current_step === 'rejected') {
              setCustomerStatus('rejected');
              localStorage.setItem('flowai_customer_status', 'rejected');
              setCurrentStep('rejected');
              setEscalationInfo(null);
              if (data.rejection_notes) setRejectionNotes(data.rejection_notes);
            } else if (data.current_step) {
              setCurrentStep(data.current_step);
            }
            // Always update pending_items — even empty array clears stale doc prompts
            if (data.pending_items !== undefined && data.pending_items !== null) {
              setPendingItems(Array.isArray(data.pending_items) ? data.pending_items : []);
            }
            if (data.documents_status) setDocStatus(data.documents_status);
            // Escalation: only show if backend explicitly says is_escalated=true OR step is escalated, and not rejected
            if (!data.is_rejected && data.customer_status !== 'rejected' && data.current_step !== 'rejected' && (data.is_escalated || data.current_step === 'escalated' || data.current_step === 'escalation')) {
              setEscalationInfo({ message: data.escalation_reason || "Case escalated to human support team", docType: '' });
              setCurrentStep('escalated');
            } else {
              setEscalationInfo(null);
            }
            // Restore messages on page load or sync
            if (data.messages && data.messages.length > 0) {
              const cleaned = formatMessagesList(data.messages);
              if (cleaned.length > 0) {
                setMessages(prev => {
                  if (prev.length === 0 || cleaned.length >= prev.length) {
                    return cleaned;
                  }
                  return prev;
                });
              }
            }
          }
        } catch (e) {
          console.error("Sync error", e);
        }
      };

      // --- Explicit Session Refresh Handler ---
      const handleRefreshSession = async () => {
        const sid = sessionId || localStorage.getItem('flowai_session_id');
        if (!sid) {
          setStatusAlert({ type: 'error', text: 'No active session found to refresh.' });
          return;
        }
        setIsRefreshing(true);
        setStatusAlert(null);
        try {
          const res = await fetch(`/onboarding/state/${encodeURIComponent(sid)}`);
          if (res.ok) {
            const data = await res.json();
            if (data.customer_id) {
              setCustomerId(data.customer_id);
              localStorage.setItem('flowai_customer_id', data.customer_id);
            }
            if (data.customer_name) {
              setCustomerName(data.customer_name);
              localStorage.setItem('flowai_customer_name', data.customer_name);
            }
            if (data.customer_email) {
              setCustomerEmail(data.customer_email);
              localStorage.setItem('flowai_customer_email', data.customer_email);
            }
            if (data.customer_type) {
              setCustomerType(data.customer_type);
            }
            if (data.customer_status) {
              setCustomerStatus(data.customer_status);
              localStorage.setItem('flowai_customer_status', data.customer_status);
            }
            if (data.is_rejected || data.customer_status === 'rejected' || data.current_step === 'rejected') {
              setCustomerStatus('rejected');
              localStorage.setItem('flowai_customer_status', 'rejected');
              setCurrentStep('rejected');
              setEscalationInfo(null);
              if (data.rejection_notes) setRejectionNotes(data.rejection_notes);
            } else if (data.current_step) {
              setCurrentStep(data.current_step);
            }
            if (data.pending_items !== undefined && data.pending_items !== null) {
              setPendingItems(Array.isArray(data.pending_items) ? data.pending_items : []);
            }
            if (data.documents_status) setDocStatus(data.documents_status);
            if (!data.is_rejected && data.customer_status !== 'rejected' && data.current_step !== 'rejected' && (data.is_escalated || data.current_step === 'escalated' || data.current_step === 'escalation')) {
              setEscalationInfo({ message: data.escalation_reason || "Case escalated to human support team", docType: '' });
              setCurrentStep('escalated');
            } else {
              setEscalationInfo(null);
            }
            // Synchronize conversation messages from backend state
            if (data.messages && data.messages.length > 0) {
              const cleaned = formatMessagesList(data.messages);
              if (cleaned.length > 0) {
                setMessages(cleaned);
              }
            }
            setStatusAlert({ type: 'success', text: `Session state refreshed successfully!` });
          } else {
            setStatusAlert({ type: 'error', text: `Failed to fetch session state (${res.status}).` });
          }
        } catch (e) {
          console.error("Refresh error", e);
          setStatusAlert({ type: 'error', text: 'Network error while refreshing session.' });
        } finally {
          setIsRefreshing(false);
        }
      };

      // --- Start Onboarding ---
      const handleStart = async () => {
        setIsSending(true);
        setStatusAlert(null);
        try {
          const res = await fetch('/onboarding/start', { method: 'POST' });
          const data = await res.json();
          if (data.success) {
            setSessionId(data.session_id);
            localStorage.setItem('flowai_session_id', data.session_id);
            if (data.customer_id) {
              setCustomerId(data.customer_id);
              localStorage.setItem('flowai_customer_id', data.customer_id);
            }
            setCurrentStep(data.current_step || 'greeting');
            setMessages([
              { sender: 'agent', text: data.response, time: new Date().toLocaleTimeString() }
            ]);
            syncSessionState(data.session_id);
          } else {
            setStatusAlert({ type: 'error', text: data.error || 'Failed to start onboarding' });
          }
        } catch (e) {
          setStatusAlert({ type: 'error', text: 'Network error starting onboarding' });
        } finally {
          setIsSending(false);
        }
      };

      // --- Resume Onboarding by Customer Email ---
      const handleResume = async (resumeEmailOrSid) => {
        const identifier = (typeof resumeEmailOrSid === 'string' ? resumeEmailOrSid : resumeEmailInput).trim();
        if (!identifier) {
          setStatusAlert({ type: 'error', text: 'Please enter your registered email address to resume.' });
          return;
        }
        setIsSending(true);
        setStatusAlert(null);
        try {
          const isEmail = identifier.includes('@');
          const queryParam = isEmail 
            ? `email=${encodeURIComponent(identifier)}` 
            : `session_id=${encodeURIComponent(identifier)}`;
          
          const res = await fetch(`/onboarding/resume?${queryParam}`, { method: 'POST' });
          const data = await res.json();
          if (data.success && data.session_id) {
            setSessionId(data.session_id);
            localStorage.setItem('flowai_session_id', data.session_id);
            if (data.customer_id) {
              setCustomerId(data.customer_id);
              localStorage.setItem('flowai_customer_id', data.customer_id);
            }
            if (data.customer_name) {
              setCustomerName(data.customer_name);
              localStorage.setItem('flowai_customer_name', data.customer_name);
            }
            if (data.customer_email) {
              setCustomerEmail(data.customer_email);
              localStorage.setItem('flowai_customer_email', data.customer_email);
            }
            if (data.customer_type) {
              setCustomerType(data.customer_type);
            }
            if (data.customer_status) {
              setCustomerStatus(data.customer_status);
              localStorage.setItem('flowai_customer_status', data.customer_status);
            }
            if (data.is_rejected || data.customer_status === 'rejected' || data.current_step === 'rejected') {
              setCustomerStatus('rejected');
              localStorage.setItem('flowai_customer_status', 'rejected');
              setCurrentStep('rejected');
              setEscalationInfo(null);
              if (data.rejection_notes) setRejectionNotes(data.rejection_notes);
            } else if (data.current_step) {
              setCurrentStep(data.current_step);
            }
            if (data.pending_items !== undefined && data.pending_items !== null) {
              setPendingItems(Array.isArray(data.pending_items) ? data.pending_items : []);
            }
            if (data.documents_status) setDocStatus(data.documents_status);
            
            // Restore escalation state
            if (!data.is_rejected && data.customer_status !== 'rejected' && data.current_step !== 'rejected' && (data.is_escalated || data.current_step === 'escalated' || data.current_step === 'escalation')) {
              setEscalationInfo({ message: data.escalation_reason || "Case escalated to human support team", docType: '' });
              setCurrentStep('escalated');
            } else {
              setEscalationInfo(null);
            }

            // Restore conversation messages
            if (data.messages && data.messages.length > 0) {
              const cleaned = formatMessagesList(data.messages);
              setMessages(cleaned);
            } else if (data.response) {
              setMessages([
                { sender: 'agent', text: data.response, time: new Date().toLocaleTimeString() }
              ]);
            }
            setResumeEmailInput('');
            setStatusAlert({ type: 'success', text: `Welcome back${data.customer_name ? ', ' + data.customer_name : ''}! Your onboarding session has been restored.` });
          } else {
            setStatusAlert({ type: 'error', text: data.detail || 'No active onboarding session found for this email.' });
          }
        } catch (e) {
          console.error("Resume error", e);
          setStatusAlert({ type: 'error', text: 'Error connecting to onboarding server. Please try again.' });
        } finally {
          setIsSending(false);
        }
      };

      // --- Send Chat Message ---
      const handleSendMessage = async (e) => {
        e?.preventDefault();
        if (!inputMsg.trim() || isSending || !sessionId) return;

        const userText = inputMsg.trim();
        setInputMsg('');
        const userMsgObj = { sender: 'user', text: userText, time: new Date().toLocaleTimeString() };
        setMessages(prev => [...prev, userMsgObj]);
        setIsSending(true);

        try {
          const url = `/onboarding/chat?session_id=${encodeURIComponent(sessionId)}&message=${encodeURIComponent(userText)}`;
          const res = await fetch(url, { method: 'POST' });
          const data = await res.json();

          if (res.ok && data.success) {
            if (data.customer_id) {
              setCustomerId(data.customer_id);
              localStorage.setItem('flowai_customer_id', data.customer_id);
            }
            if (data.customer_type) {
              setCustomerType(data.customer_type);
            }
            if (data.current_step) setCurrentStep(data.current_step);
            if (data.pending_items) setPendingItems(data.pending_items);
            if (data.documents_status) setDocStatus(data.documents_status);
            if (data.messages && data.messages.length > 0) {
              const cleaned = formatMessagesList(data.messages);
              setMessages(cleaned);
            } else {
              setMessages(prev => [
                ...prev,
                { sender: 'agent', text: data.response, time: new Date().toLocaleTimeString() }
              ]);
            }
          } else {
            setMessages(prev => [
              ...prev,
              { sender: 'agent', text: data.detail || data.error || "Sorry, I had trouble processing that.", time: new Date().toLocaleTimeString(), isError: true }
            ]);
          }
        } catch (err) {
          setMessages(prev => [
            ...prev,
            { sender: 'agent', text: "Connection drop. Please check your network and try again.", time: new Date().toLocaleTimeString(), isError: true }
          ]);
        } finally {
          setIsSending(false);
        }
      };

      // --- Upload Document ---
      const handleDocumentUpload = async (docType, file) => {
        if (!file || !sessionId) return;
        setUploadingDoc(docType);
        setStatusAlert(null);

        const formData = new FormData();
        formData.append('file', file);

        try {
          const url = `/onboarding/document?session_id=${encodeURIComponent(sessionId)}&document_type=${encodeURIComponent(docType)}`;
          const res = await fetch(url, { method: 'POST', body: formData });
          const data = await res.json();

          if (res.ok) {
            if (data.messages && data.messages.length > 0) {
              const cleaned = formatMessagesList(data.messages);
              setMessages(cleaned);
            } else {
              setMessages(prev => [
                ...prev,
                { sender: 'user', text: `📎 Uploaded ${formatDocType(docType)}`, time: new Date().toLocaleTimeString() },
                { sender: 'agent', text: data.response || `✅ ${docType} successfully verified!`, time: new Date().toLocaleTimeString() }
              ]);
            }
            if (data.current_step) setCurrentStep(data.current_step);
            syncSessionState(sessionId);
            setStatusAlert({ type: 'success', text: `Document ${docType} uploaded and verified!` });
          } else {
            const errDetail = data.detail || 'Document verification failed.';
            setMessages(prev => [
              ...prev,
              { sender: 'agent', text: `❌ ${errDetail}`, time: new Date().toLocaleTimeString(), isError: true }
            ]);
            const isActualEscalation = (
              (errDetail.includes('Maximum 3 verification attempts reached') || errDetail.includes('has been escalated to our human support team')) &&
              !errDetail.includes('attempts remaining')
            );
            if (isActualEscalation) {
              setEscalationInfo({ message: errDetail, docType });
              setCurrentStep('escalated');
            }
            syncSessionState(sessionId);
            setStatusAlert({ type: 'error', text: errDetail });
          }
        } catch (e) {
          setStatusAlert({ type: 'error', text: 'Network error during document upload' });
        } finally {
          setUploadingDoc(null);
        }
      };

      // --- Admin Dashboard Fetch ---
      const fetchAdminDashboard = async () => {
        setAdminLoading(true);
        try {
          const [dashRes, escRes] = await Promise.all([
            fetch('/onboarding/dashboard'),
            fetch('/escalations?status=all')
          ]);
          if (dashRes.ok) {
            const dData = await dashRes.json();
            setDashboardData(dData);
            // Reconcile selection on dashboard refresh: keep only existing incomplete sessions
            setSelectedCustomerSessions(prev => {
              if (!prev || prev.length === 0) return [];
              const validSessions = new Set(
                (dData.prioritized_queue || [])
                  .filter(c => c.session_id && !(c.sla_status === 'met' || c.current_step === 'complete' || c.customer_status === 'completed' || (!c.pending_items || c.pending_items.length === 0)))
                  .map(c => c.session_id)
              );
              return prev.filter(sid => validSessions.has(sid));
            });
          }
          if (escRes.ok) {
            const escJson = await escRes.json();
            const list = Array.isArray(escJson) ? escJson : (escJson.escalations || []);
            setEscalations(list);
          }
        } catch (e) {
          console.error("Admin dashboard fetch error", e);
        } finally {
          setAdminLoading(false);
        }
      };

      useEffect(() => {
        if (activeTab === 'admin') {
          fetchAdminDashboard();
        }
      }, [activeTab]);

      // --- Batch Proactive Follow-up Trigger ---
      const handleBatchFollowUp = async () => {
        if (!selectedCustomerSessions || selectedCustomerSessions.length === 0) return;
        setBatchFollowUpLoading(true);
        try {
          const res = await fetch('/onboarding/follow-up', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_ids: selectedCustomerSessions })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            const count = data.total_follow_ups_sent ?? selectedCustomerSessions.length;
            alert(`Batch Follow-up successfully sent to ${count} customer(s)!`);
            setSelectedCustomerSessions([]);
            fetchAdminDashboard();
          } else {
            alert(`Batch follow-up notice: ${data.detail || data.error || 'Failed to trigger batch follow-up.'}`);
          }
        } catch (e) {
          alert('Network error triggering batch follow-up.');
        } finally {
          setBatchFollowUpLoading(false);
        }
      };

      // --- Proactive Follow-up Trigger ---
      const handleTriggerFollowUp = async (sid) => {
        try {
          const res = await fetch(`/onboarding/follow-up/${sid}`, { method: 'POST' });
          const data = await res.json();
          if (res.ok && data.success) {
            alert(`Proactive Follow-up sent to customer!\n\nMessage: "${data.follow_up_message}"\nSLA Status: ${data.sla_status}`);
            fetchAdminDashboard();
          } else {
            alert(`Follow-up notice: ${data.detail || 'Customer is already completed or on track.'}`);
          }
        } catch (e) {
          alert('Error triggering follow-up');
        }
      };

      // --- Resolve Escalation Ticket (3 actions) ---
      const handleResolveEscalation = async (escId, action) => {
        if (!escId) { alert('Invalid escalation ticket ID.'); return; }
        if (!resolveNotes.trim()) { alert('Please enter resolution notes.'); return; }
        if (action === 'request_reupload' && !reuploadMessage.trim()) {
          alert('Please enter the re-upload message to send to the customer.');
          return;
        }
        try {
          const payloadData = {
            action: action || resolveAction,
            resolution_notes: resolveNotes.trim(),
            resolved_by: 'human_agent',
            ...(action === 'request_reupload' && reuploadMessage.trim()
              ? { reupload_message: reuploadMessage.trim() }
              : {})
          };
          const res = await fetch(`/escalations/${encodeURIComponent(escId)}/resolve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payloadData)
          });
          if (res.ok) {
            const actionLabel = action === 'approve' ? '✅ Approved & Verified'
              : action === 'request_reupload' ? '🔄 Re-upload Requested'
              : '❌ Rejected';
            alert(`Escalation resolved: ${actionLabel}`);
            setSelectedEscalation(null);
            setResolveNotes('');
            setReuploadMessage('');
            setResolveAction('approve');
            fetchAdminDashboard();
          } else {
            const errData = await res.json().catch(() => ({}));
            alert('Failed to resolve escalation: ' + (errData.detail || res.statusText));
          }
        } catch (e) {
          console.error("Resolve error", e);
          alert('Error resolving escalation');
        }
      };


      const formatMsg = (text) => {
        if (!text) return '';
        let s = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
        s = s.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-white">$1</strong>');
        s = s.replace(/`([^`]+)`/g, '<code class="bg-slate-900/80 text-indigo-300 px-1.5 py-0.5 rounded text-xs font-mono">$1</code>');
        s = s.replace(/^[•\-] (.*$)/gm, '<span class="inline-block text-indigo-400 font-bold mr-1.5">•</span>$1');
        return s;
      };

      const formatDocType = (type) => {
        if (!type) return 'Document';
        const map = {
          pan_card: 'PAN Card / Tax ID',
          address_proof: 'Proof of Address (Aadhaar / Passport)',
          company_registration: 'Company Registration Certificate',
          gst_certificate: 'GST Certificate'
        };
        return map[type.toLowerCase()] || type.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* --- TOP NAVBAR --- */}
          <header className="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-30 px-6 py-3.5 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="bg-gradient-to-tr from-indigo-500 to-violet-500 p-2 rounded-xl shadow-lg shadow-indigo-500/20">
                <IconBot />
              </div>
              <div>
                <h1 className="font-bold text-lg text-white flex items-center gap-2">
                  FlowAI <span className="text-xs bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full font-medium">Onboarding Agent</span>
                </h1>
                <p className="text-xs text-slate-400">Autonomous multi-tier onboarding with SLA intelligence</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex items-center space-x-2 bg-slate-900/60 p-1 rounded-xl border border-slate-700/50">
              <button
                onClick={() => { setActiveTab('customer'); window.history.pushState({}, '', '/'); }}
                className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all flex items-center gap-2 ${activeTab === 'customer' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <IconUser /> Customer Portal
              </button>
              <button
                onClick={() => { setActiveTab('admin'); window.history.pushState({}, '', '/admin'); }}
                className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all flex items-center gap-2 ${activeTab === 'admin' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <IconClock /> Operations & SLA
              </button>
            </div>

            {/* System Health Indicator */}
            <div className="hidden md:flex items-center space-x-3 text-xs">
              <div className="flex items-center space-x-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
                <span className={`w-2 h-2 rounded-full ${health?.status === 'healthy' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                <span className="text-slate-400 font-mono">LLM: Groq Qwen-27B</span>
              </div>
            </div>
          </header>

          {/* --- ALERT BANNER --- */}
          {statusAlert && (
            <div className={`px-6 py-2 text-sm flex items-center justify-between transition-all ${statusAlert.type === 'error' ? 'bg-rose-950/80 border-b border-rose-800/80 text-rose-300' : 'bg-emerald-950/80 border-b border-emerald-800/80 text-emerald-300'}`}>
              <div className="flex items-center gap-2">
                <span>{statusAlert.type === 'error' ? '⚠️' : '✅'}</span>
                <span>{statusAlert.text}</span>
              </div>
              <button onClick={() => setStatusAlert(null)} className="text-xs opacity-70 hover:opacity-100">Dismiss</button>
            </div>
          )}

          {/* --- VIEW ROUTER --- */}
          {activeTab === 'customer' ? (
            /* =========================================================
               CUSTOMER ONBOARDING PORTAL
               ========================================================= */
            <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
              
              {/* Left Column: Interactive Chat (7 Cols) */}
              <div className="lg:col-span-7 flex flex-col bg-slate-800/50 border border-slate-700/60 rounded-2xl shadow-xl overflow-hidden backdrop-blur">
                
                {/* Chat Header */}
                <div className="px-5 py-3.5 border-b border-slate-700/60 flex items-center justify-between bg-slate-800/80">
                  <div className="flex items-center space-x-3">
                    <div className="relative">
                      <div className="w-9 h-9 rounded-xl bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
                        <IconBot />
                      </div>
                      <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 rounded-full ring-2 ring-slate-800"></span>
                    </div>
                    <div>
                      <h2 className="text-sm font-semibold text-white">AI Onboarding Assistant</h2>
                      <p className="text-xs text-slate-400">
                        {sessionId ? `Session: ${sessionId.slice(0, 12)}...` : 'Select tier to start'}
                      </p>
                    </div>
                  </div>

                  {/* Step Badge */}
                  <span className={`text-xs px-2.5 py-1 rounded-full font-medium capitalize border ${
                    isRejected ? 'bg-rose-500/20 text-rose-400 border-rose-500/30 font-bold' :
                    currentStep === 'complete' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' :
                    currentStep === 'collect_docs' ? 'bg-violet-500/20 text-violet-400 border-violet-500/30' :
                    currentStep === 'collect_info' ? 'bg-blue-500/20 text-blue-400 border-blue-500/30' :
                    'bg-slate-700/40 text-slate-300 border-slate-600/40'
                  }`}>
                    {isRejected ? '❌ Application Rejected' : `Step: ${currentStep.replace('_', ' ')}`}
                  </span>
                </div>

                {/* Application Rejection Banner */}
                {isRejected && (
                  <div className="bg-rose-950/60 border-b border-rose-800/80 p-4 flex items-start gap-3 animate-fade-in">
                    <div className="w-8 h-8 rounded-lg bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-300 flex-shrink-0 text-base">
                      ❌
                    </div>
                    <div className="flex-1 text-xs text-rose-200">
                      <p className="font-bold text-sm text-rose-300">Application Rejected</p>
                      <p className="mt-0.5">Your onboarding application has been reviewed and permanently rejected by our verification team.</p>
                      {rejectionNotes && (
                        <div className="mt-2 bg-rose-950/80 p-2.5 rounded-lg border border-rose-800/60 text-rose-200">
                          <span className="font-semibold text-rose-300">Reviewer Notes: </span>{rejectionNotes}
                        </div>
                      )}
                      <p className="mt-2 text-slate-400">All further document uploads and onboarding interactions have been disabled.</p>
                    </div>
                  </div>
                )}

                {/* Escalation Warning Modal / Banner */}
                {!isRejected && escalationInfo && (
                  <div className="bg-amber-950/40 border-b border-amber-800/60 p-4 flex items-start gap-3">
                    <IconAlert />
                    <div className="flex-1 text-xs text-amber-200">
                      <p className="font-semibold text-sm text-amber-300">Case Escalated to Human Support</p>
                      <p className="mt-0.5">{escalationInfo.message}</p>
                      <p className="mt-1 text-slate-400">Our operations team has been notified. You can still chat or provide documents below.</p>
                    </div>
                  </div>
                )}

                {/* Chat Messages Log */}
                <div className="flex-1 p-4 overflow-y-auto space-y-3.5 min-h-[380px] max-h-[520px]">
                  {messages.length === 0 && (
                    <div className="h-full flex flex-col items-center justify-center text-center p-6 text-slate-400">
                      <div className="w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 mb-3">
                        <IconBot />
                      </div>
                      <h3 className="text-base font-semibold text-slate-200">Welcome to Onboarding!</h3>
                      <p className="text-xs max-w-sm mt-1 text-slate-400">
                        Click Start Onboarding on the right to begin, or enter your registered email address to resume where you left off.
                      </p>
                    </div>
                  )}

                  {messages.map((m, idx) => (
                    <div
                      key={idx}
                      className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}
                    >
                      <div className="flex items-end gap-2 max-w-[85%]">
                        {m.sender === 'agent' && (
                          <div className="w-6 h-6 rounded-lg bg-indigo-600/40 border border-indigo-500/30 flex items-center justify-center text-indigo-300 flex-shrink-0 mb-1">
                            <IconBot />
                          </div>
                        )}
                        <div
                          className={`px-4 py-2.5 rounded-2xl text-sm leading-relaxed whitespace-pre-line shadow-md ${
                            m.sender === 'user'
                              ? 'bg-indigo-600 text-white rounded-br-none'
                              : m.isError
                              ? 'bg-rose-950/80 border border-rose-800 text-rose-200 rounded-bl-none'
                              : 'bg-slate-700/80 border border-slate-600/50 text-slate-100 rounded-bl-none'
                          }`}
                          dangerouslySetInnerHTML={{ __html: formatMsg(m.text) }}
                        />
                      </div>
                      <span className="text-[10px] text-slate-500 mt-1 px-1">{m.time}</span>
                    </div>
                  ))}

                  {isSending && (
                    <div className="flex items-center space-x-2 text-slate-400 text-xs px-2 py-1">
                      <div className="w-2 h-2 bg-indigo-500 rounded-full animate-ping"></div>
                      <span>Agent is thinking...</span>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                {/* Document Action Area: Shows In-Chat Upload Card, Rejection Notice, OR Human Review Notice if Escalated */}
                {isRejected ? (
                  <div className="mx-3 mb-2.5 p-3.5 bg-gradient-to-r from-rose-950/90 via-slate-900 to-rose-950/90 border border-rose-500/50 rounded-2xl shadow-xl flex items-center justify-between gap-3 animate-fade-in">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-300 flex-shrink-0 text-base">
                        ❌
                      </div>
                      <div>
                        <div className="text-xs font-bold text-rose-200 flex items-center gap-1.5">
                          <span>Application Rejected — Document Uploads Blocked</span>
                          <span className="text-[9px] bg-rose-500/30 text-rose-300 border border-rose-500/40 px-2 py-0.5 rounded-full uppercase tracking-wider font-mono">
                            Closed
                          </span>
                        </div>
                        <div className="text-[11px] text-slate-300 mt-0.5">
                          This onboarding case has been closed by our verification team. No further uploads can be submitted.
                        </div>
                      </div>
                    </div>
                  </div>
                ) : isCaseEscalated ? (
                  <div className="mx-3 mb-2.5 p-3.5 bg-gradient-to-r from-amber-950/90 via-slate-900 to-amber-950/90 border border-amber-500/50 rounded-2xl shadow-xl flex items-center justify-between gap-3 animate-fade-in">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-300 flex-shrink-0">
                        <IconAlert />
                      </div>
                      <div>
                        <div className="text-xs font-bold text-amber-200 flex items-center gap-1.5">
                          <span>Case Under Human Agent Review</span>
                          <span className="text-[9px] bg-amber-500/30 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full uppercase tracking-wider font-mono">
                            Escalated
                          </span>
                        </div>
                        <div className="text-[11px] text-slate-300 mt-0.5">
                          Maximum verification attempts reached. Our operations team is reviewing your case. No further upload is required right now.
                        </div>
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={() => syncSessionState(sessionId)}
                      className="bg-amber-600 hover:bg-amber-500 active:scale-95 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition-all shadow-md flex items-center gap-1.5 flex-shrink-0"
                    >
                      <IconRefresh />
                      <span>Refresh</span>
                    </button>
                  </div>
                ) : (
                  currentStep === 'collect_docs' && activeDoc && (
                    <div className="mx-3 mb-2.5 p-3.5 bg-gradient-to-r from-indigo-950/90 via-slate-900 to-indigo-950/90 border border-indigo-500/50 rounded-2xl shadow-xl flex items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-indigo-600/30 border border-indigo-400/40 flex items-center justify-center text-indigo-300 flex-shrink-0">
                          <IconUpload />
                        </div>
                        <div>
                          <div className="text-xs font-bold text-white flex items-center gap-1.5">
                            <span>Please Upload: {getDocDisplayName(activeDoc)}</span>
                            <span className="text-[9px] bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 px-2 py-0.5 rounded-full uppercase tracking-wider font-mono">
                              Action Required
                            </span>
                          </div>
                          <div className="text-[11px] text-slate-300 mt-0.5">
                            Select your document image or PDF for AI Vision verification
                          </div>
                        </div>
                      </div>

                      <div>
                        {uploadingDoc === activeDoc ? (
                          <div className="flex items-center gap-2 text-indigo-300 text-xs px-3.5 py-2 bg-indigo-950/80 border border-indigo-500/30 rounded-xl">
                            <div className="w-3.5 h-3.5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
                            <span>Verifying with Vision...</span>
                          </div>
                        ) : (
                          <label className="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-semibold px-4 py-2 rounded-xl cursor-pointer transition-all shadow-lg shadow-indigo-600/30 flex items-center gap-1.5 flex-shrink-0">
                            <span>Choose File</span>
                            <input
                              type="file"
                              className="hidden"
                              accept=".pdf,.png,.jpg,.jpeg,image/*"
                              onChange={(e) => {
                                const file = e.target.files?.[0];
                                if (file) {
                                  handleDocumentUpload(activeDoc, file);
                                  e.target.value = '';
                                }
                              }}
                            />
                          </label>
                        )}
                      </div>
                    </div>
                  )
                )}

                {/* Chat Input Bar */}
                <form onSubmit={handleSendMessage} className="p-3 border-t border-slate-700/60 bg-slate-800/80 flex items-center gap-2">
                  <input
                    type="text"
                    value={inputMsg}
                    onChange={(e) => setInputMsg(e.target.value)}
                    placeholder={isRejected ? "Application has been rejected. Chat is disabled." : sessionId ? "Type your message or correction (e.g., 'Change my email to...')..." : "Start a session first..."}
                    disabled={!sessionId || isSending || isRejected}
                    className="flex-1 bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition-all disabled:opacity-50"
                  />
                  <button
                    type="submit"
                    disabled={!sessionId || !inputMsg.trim() || isSending || isRejected}
                    className="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition-all shadow-md flex items-center gap-1.5 disabled:cursor-not-allowed"
                  >
                    <span>Send</span>
                    <IconSend />
                  </button>
                </form>
              </div>

              {/* Right Column: Clean Journey Overview & Profile (5 Cols) */}
              <div className="lg:col-span-5 flex flex-col space-y-4">
                
                {/* 1. Customer Profile & Session Card */}
                <div className="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 md:p-5 backdrop-blur shadow-lg">
                  <h3 className="text-sm font-semibold text-white flex items-center gap-2">
                    <IconUser /> Customer Profile & Journey
                  </h3>

                  {!sessionId ? (
                    <div className="mt-3.5 space-y-3">
                      <p className="text-xs text-slate-300 leading-relaxed">
                        Start your automated onboarding with our AI Assistant. Registration details and KYC documents will be gathered naturally one-by-one through the chat.
                      </p>

                      <button
                        onClick={handleStart}
                        disabled={isSending}
                        className="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2"
                      >
                        {isSending ? 'Initializing Assistant...' : 'Start Onboarding'}
                      </button>

                      <div className="relative my-2 text-center">
                        <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-700"></div></div>
                        <span className="relative bg-slate-800 px-2 text-[10px] text-slate-500 uppercase">or resume by email</span>
                      </div>

                      <form
                        onSubmit={(e) => {
                          e.preventDefault();
                          handleResume(resumeEmailInput);
                        }}
                        className="space-y-2"
                      >
                        <div className="flex gap-2">
                          <input
                            type="email"
                            required
                            placeholder="Enter your registered email address..."
                            value={resumeEmailInput}
                            onChange={(e) => setResumeEmailInput(e.target.value)}
                            className="flex-1 bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 outline-none transition-all"
                          />
                          <button
                            type="submit"
                            disabled={isSending || !resumeEmailInput.trim()}
                            className="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 text-white text-xs px-4 py-2 rounded-xl font-medium transition-all shadow-md flex items-center gap-1 flex-shrink-0 disabled:cursor-not-allowed"
                          >
                            <span>Resume Session</span>
                          </button>
                        </div>
                        <p className="text-[11px] text-slate-400">
                          Already started? Enter your email to restore your session, documents, and chat history.
                        </p>
                      </form>

                  </span>
                </div>

                <div className="p-4 divide-y divide-slate-700/40">
                  {(!escalations || (Array.isArray(escalations) && escalations.length === 0)) ? (
                    <p className="text-xs text-slate-500 text-center py-4 italic">No human escalations recorded. All automated verifications healthy!</p>
                  ) : (
                    (Array.isArray(escalations) ? escalations : []).map((esc) => {
                      const escId = esc.id || esc.escalation_id || 'ESC';
                      const docType = esc.document_type || esc.context?.document_type;
                      const fileUrl = esc.file_url || esc.context?.file_url;
                      return (
                      <div key={escId} className="py-3.5 flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
                        <div className="space-y-1.5 max-w-2xl">
                          <div className="flex flex-wrap items-center gap-2">
                            <span className="font-mono text-xs text-indigo-400 font-bold">#{escId.toString().slice(0, 8)}</span>
                            <span className={`text-[10px] px-2 py-0.5 rounded-full uppercase font-bold ${
                              esc.status === 'resolved' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400 animate-pulse'
                            }`}>
                              {esc.status || 'pending'}
                            </span>
                            {docType && (
                              <span className="text-[11px] bg-indigo-950/60 text-indigo-200 border border-indigo-800/50 px-2 py-0.5 rounded-md font-medium">
                                📄 {formatDocType(docType)}
                              </span>
                            )}
                            <span className="text-[11px] text-slate-400">Created: {esc.created_at ? new Date(esc.created_at).toLocaleString() : 'Recent'}</span>
                          </div>
                          <p className="text-xs text-slate-200 font-medium">{esc.reason || 'Verification failure'}</p>
                          {esc.recommended_action && (
                            <p className="text-[11px] text-amber-300/90">Action: {esc.recommended_action}</p>
                          )}
                        </div>

                        <div className="flex items-center gap-2">
                          {fileUrl && (
                            <a
                              href={fileUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="bg-slate-700/60 hover:bg-slate-700 text-slate-200 border border-slate-600/60 px-3 py-1.5 rounded-xl text-xs font-medium transition-all flex items-center gap-1.5"
                            >
                              <span>👁️</span> Preview Document ↗
                            </a>
                          )}
                          {esc.status !== 'resolved' && (
                            <button
                              onClick={() => setSelectedEscalation(esc)}
                              className="bg-emerald-600/40 hover:bg-emerald-600 text-emerald-200 border border-emerald-500/40 px-3 py-1.5 rounded-xl text-xs font-medium transition-all"
                            >
                              Resolve Ticket
                            </button>
                          )}
                        </div>
                      </div>
                    );})
                  )}
                </div>
              </div>

              {/* Resolution & Document Review Modal */}
              {selectedEscalation && (() => {
                const escId = (selectedEscalation?.id || selectedEscalation?.escalation_id || 'ESC').toString();
                const docType = selectedEscalation.document_type || selectedEscalation.context?.document_type;
                const fileUrl = selectedEscalation.file_url || selectedEscalation.context?.file_url;
                const fileName = selectedEscalation.file_name || selectedEscalation.context?.file_name || selectedEscalation.context?.last_file;
                const isImage = fileUrl && (fileUrl.toLowerCase().endsWith('.png') || fileUrl.toLowerCase().endsWith('.jpg') || fileUrl.toLowerCase().endsWith('.jpeg'));
                const isPdf = fileUrl && fileUrl.toLowerCase().endsWith('.pdf');

                return (
                  <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                    <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4 my-8 max-h-[90vh] overflow-y-auto">
                      <div className="flex items-center justify-between border-b border-slate-700/80 pb-3">
                        <div>
                          <h3 className="text-base font-bold text-white flex items-center gap-2">
                            <span>Resolve Escalation</span>
                            <span className="font-mono text-indigo-400 text-sm">#{escId.slice(0, 8)}</span>
                          </h3>
                          <p className="text-xs text-slate-400 mt-0.5">
                            Customer: {selectedEscalation.customer_name || 'Customer'} ({selectedEscalation.customer_email || 'No email'})
                          </p>
                        </div>
                        <button
                          onClick={() => setSelectedEscalation(null)}
                          className="text-slate-400 hover:text-white text-lg font-bold p-1"
                        >
                          ✕
                        </button>
                      </div>

                      {/* Document Details & Failure Overview Card */}
                      <div className="bg-slate-900/90 rounded-xl p-3.5 border border-slate-700/60 space-y-2 text-xs">
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <div className="flex items-center gap-2">
                            <span className="text-slate-400 font-medium">Under Review:</span>
                            <span className="bg-indigo-950/70 border border-indigo-700/50 text-indigo-200 px-2 py-0.5 rounded font-semibold">
                              📄 {formatDocType(docType)}
                            </span>
                          </div>
                          {fileName && (
                            <span className="font-mono text-slate-400 text-[11px] truncate max-w-xs">
                              File: {fileName}
                            </span>
                          )}
                        </div>

                        <div className="text-rose-300/90 bg-rose-950/30 p-2 rounded-lg border border-rose-900/40">
                          <strong className="text-rose-200">Failure Reason:</strong> {selectedEscalation.reason || 'Verification failure'}
                        </div>

                        {selectedEscalation.recommended_action && (
                          <div className="text-amber-300/90 bg-amber-950/20 p-2 rounded-lg border border-amber-900/30 text-[11px]">
                            <strong className="text-amber-200">AI Recommendation:</strong> {selectedEscalation.recommended_action}
                          </div>
                        )}
                      </div>

                      {/* Interactive Document Inspection Box */}
                      <div className="space-y-1.5">
                        <div className="flex items-center justify-between text-xs">
                          <span className="font-semibold text-slate-300 flex items-center gap-1.5">
                            <span>🔍</span> Document Preview & Inspection:
                          </span>
                          {fileUrl && (
                            <a
                              href={fileUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1 underline text-xs"
                            >
                              Open Full Size in New Tab ↗
                            </a>
                          )}
                        </div>

                        {fileUrl ? (
                          <div className="bg-slate-950 rounded-xl border border-slate-700/80 p-2">
                            {isImage ? (
                              <div className="text-center">
                                <img
                                  src={encodeURI(fileUrl)}
                                  alt="Document Preview"
                                  className="max-h-64 rounded-lg mx-auto object-contain border border-slate-800"
                                  onError={(e) => {
                                    e.target.style.display = 'none';
                                  }}
                                />
                              </div>
                            ) : isPdf ? (
                              <iframe
                                src={encodeURI(fileUrl)}
                                title="Document PDF Preview"
                                className="w-full h-72 rounded-lg border border-slate-800 bg-slate-900"
                              />
                            ) : (
                              <div className="p-4 flex items-center justify-between text-xs text-slate-300">
                                <span>📄 File: {fileName || 'customer_document'}</span>
                                <a
                                  href={fileUrl}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium"
                                >
                                  Download / View ↗
                                </a>
                              </div>
                            )}
                          </div>
                        ) : (
                          <div className="text-xs text-slate-400 italic bg-slate-900/60 p-3 rounded-xl border border-slate-800 text-center">
                            Document was processed in memory during automated verification. Please inspect customer details and failure reason above.
                          </div>
                        )}
                      </div>

                      {/* Resolution Notes Input */}
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">
                          Human Reviewer Notes <span className="text-rose-400">*</span>
                        </label>
                        <textarea
                          rows="2"
                          value={resolveNotes}
                          onChange={(e) => setResolveNotes(e.target.value)}
                          placeholder="e.g. Manually inspected PAN card. Details match customer records."
                          className="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-xl p-3 text-xs text-white placeholder-slate-500 outline-none"
                        />
                      </div>

                      {/* Re-upload Message (shown only when re-upload action is active) */}
                      {resolveAction === 'request_reupload' && (
                        <div className="bg-amber-950/30 border border-amber-700/40 rounded-xl p-3 space-y-1.5">
                          <label className="block text-xs font-semibold text-amber-300">
                            Message to Customer <span className="text-rose-400">*</span>
                          </label>
                          <p className="text-[11px] text-amber-400/80">
                            This message will appear in the customer's chat asking them to re-upload the correct document.
                          </p>
                          <textarea
                            rows="3"
                            value={reuploadMessage}
                            onChange={(e) => setReuploadMessage(e.target.value)}
                            placeholder={`e.g. You uploaded a GST Certificate instead of a PAN Card. Please upload your PAN Card to continue.`}
                            className="w-full bg-slate-900 border border-amber-700/50 focus:border-amber-500 rounded-xl p-3 text-xs text-white placeholder-slate-600 outline-none"
                          />
                        </div>
                      )}

                      {/* 3-Action Decision Buttons */}
                      <div className="pt-2 border-t border-slate-700/60 space-y-2">
                        <p className="text-[11px] text-slate-400 font-medium">Select your decision:</p>
                        <div className="grid grid-cols-1 gap-2">

                          {/* Approve */}
                          <button
                            onClick={() => { setResolveAction('approve'); handleResolveEscalation(escId, 'approve'); }}
                            className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-semibold bg-emerald-600/20 hover:bg-emerald-600/40 border border-emerald-600/50 text-emerald-300 hover:text-emerald-200 transition-all text-left"
                          >
                            <span className="text-base">✅</span>
                            <div>
                              <div className="font-bold">Approve & Verify Manually</div>
                              <div className="font-normal text-emerald-400/70 text-[10px] mt-0.5">
                                Document is correct — AI was wrong. Mark as verified and continue onboarding.
                              </div>
                            </div>
                          </button>

                          {/* Request Re-upload */}
                          <button
                            onClick={() => {
                              if (resolveAction !== 'request_reupload') {
                                setResolveAction('request_reupload');
                              } else {
                                handleResolveEscalation(escId, 'request_reupload');
                              }
                            }}
                            className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-semibold border transition-all text-left ${
                              resolveAction === 'request_reupload'
                                ? 'bg-amber-600/30 border-amber-500/60 text-amber-200'
                                : 'bg-amber-950/20 hover:bg-amber-600/20 border-amber-700/40 text-amber-300'
                            }`}
                          >
                            <span className="text-base">🔄</span>
                            <div>
                              <div className="font-bold">
                                {resolveAction === 'request_reupload' ? 'Confirm: Send Re-upload Request →' : 'Reject & Request Re-upload'}
                              </div>
                              <div className="font-normal text-amber-400/70 text-[10px] mt-0.5">
                                {resolveAction === 'request_reupload'
                                  ? 'Fill in the message above, then click here to send.'
                                  : 'Customer uploaded wrong document. Reset and ask for correct one.'}
                              </div>
                            </div>
                          </button>

                          {/* Reject Application */}
                          <button
                            onClick={() => { setResolveAction('reject'); handleResolveEscalation(escId, 'reject'); }}
                            className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-semibold bg-rose-950/20 hover:bg-rose-600/20 border border-rose-700/40 text-rose-400 hover:text-rose-300 transition-all text-left"
                          >
                            <span className="text-base">❌</span>
                            <div>
                              <div className="font-bold">Reject Application</div>
                              <div className="font-normal text-rose-400/70 text-[10px] mt-0.5">
                                Permanently reject this onboarding application.
                              </div>
                            </div>
                          </button>

                        </div>
                        <div className="flex justify-end mt-1">
                          <button
                            onClick={() => { setSelectedEscalation(null); setResolveAction('approve'); setReuploadMessage(''); setResolveNotes(''); }}
                            className="px-4 py-2 rounded-xl text-xs font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all"
                          >
                            Cancel
                          </button>
                        </div>
                      </div>

                    </div>
                  </div>
                );
              })()}
            </main>
          )}

          {/* --- FOOTER --- */}
          <footer className="bg-slate-950 border-t border-slate-800/80 px-6 py-3.5 text-center text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2">
            <span>FlowAI Autonomous Customer Onboarding System &copy; 2026</span>
            <div className="flex items-center gap-4 text-slate-400">
              <a href="/docs" target="_blank" className="hover:text-indigo-400 transition-colors">Swagger API Docs</a>
              <span>•</span>
              <a href="/health" target="_blank" className="hover:text-indigo-400 transition-colors">Health & Metrics</a>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
